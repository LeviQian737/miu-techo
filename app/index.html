<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miu 手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<link rel="stylesheet" href="css/app.css">
<script src="js/miu-pixel.js"></script>
</head>
<body>
<div class="app" id="app">
  <header>
    <button class="nav" id="prevDay" aria-label="前一天"><svg class="i"><use href="#i-left"/></svg></button>
    <span class="date" id="date"></span><span class="dow" id="dow"></span>
    <button class="nav" id="nextDay" aria-label="后一天"><svg class="i"><use href="#i-right"/></svg></button>
    <button class="today-btn" id="todayBtn" aria-label="回到今天"><svg class="i"><use href="#i-sun"/></svg></button>
    <span class="sp"></span>
    <div class="theme" id="theme">
      <button class="theme-btn" id="themeBtn" aria-label="切换风格"><span class="sw"></span></button>
      <div class="theme-pop" role="menu">
        <button class="opt grid on" aria-label="方眼手帐"></button>
        <span class="opt locked" aria-label="即将推出"><svg class="i"><use href="#i-lock"/></svg></span>
        <span class="opt locked" aria-label="即将推出"><svg class="i"><use href="#i-lock"/></svg></span>
      </div>
    </div>
  </header>

  <aside class="left">
    <div class="rack zone" data-zone="rack" id="rack"></div>
    <div class="pile zone" data-zone="pile" id="pile"></div>
  </aside>

  <main class="center" id="center">
    <div class="lanes-head">
      <span class="lh-plan" title="计划"><svg class="i"><use href="#i-plan"/></svg></span>
      <span class="lh-act" title="实际"><svg class="i"><use href="#i-clock"/></svg></span>
    </div>
    <div class="tl-wrap">
      <div class="tl zone" id="tl" data-zone="tl">
        <div class="lane-plan" id="plan"></div>
        <div class="lane-act" id="act"></div>
        <div class="ins" id="ins"><span></span></div>
      </div>
    </div>
  </main>

  <aside class="right">
    <div class="window">
      <svg class="ring" viewBox="0 0 260 260"><circle class="track" cx="130" cy="130" r="124"/><circle class="prog" id="prog" cx="130" cy="130" r="124"/></svg>
      <div class="stage"><div id="miuHost"></div></div>
    </div>
    <div class="modes" id="modes" role="radiogroup">
      <button data-mode="stopwatch" role="radio" aria-label="自由计时"><svg class="i"><use href="#i-clock"/></svg></button>
      <button data-mode="pomodoro" role="radio" aria-label="番茄钟"><svg class="i"><use href="#i-tomato"/></svg></button>
    </div>
    <div class="timer" id="timer">00:00</div>
    <div class="ctrls">
      <button class="go" id="go" aria-label="开始"><svg class="i"><use href="#i-play"/></svg></button>
      <button id="stop" aria-label="停止" disabled><svg class="i"><use href="#i-stop"/></svg></button>
    </div>
    <div class="target" id="target"></div>
    <div class="today">
      <div class="sum" id="sum" title="今天记录的时间"></div>
      <div class="tallybig" id="tallyBig" title="今天的番茄"></div>
      <div class="stamps" id="stamps" title="今天完成"></div>
    </div>
  </aside>
</div>

<div class="trash zone" data-zone="trash" aria-label="删除"><svg class="i"><use href="#i-trash"/></svg></div>
<div class="pop" id="pop" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5 L18.5 12 L8 18.5Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 15 V22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M7 4 H17 L15.5 9 L19 13.5 H5 L8.5 9Z" fill="currentColor" stroke="#2B2B33" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-stamp" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20.5" fill="none" stroke="currentColor" stroke-width="2.6"/><circle cx="24" cy="24" r="17" fill="none" stroke="currentColor" stroke-width="1"/><ellipse cx="24" cy="29" rx="7.5" ry="6" fill="currentColor"/><ellipse cx="15.5" cy="21" rx="3" ry="3.8" fill="currentColor"/><ellipse cx="20.5" cy="15.5" rx="3" ry="3.8" fill="currentColor"/><ellipse cx="27.5" cy="15.5" rx="3" ry="3.8" fill="currentColor"/><ellipse cx="32.5" cy="21" rx="3" ry="3.8" fill="currentColor"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4.5 19.5 L5.5 15 L15.5 5 L19 8.5 L9 18.5Z M13.5 7 L17 10.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 7 H19.5 M9.5 7 V4.5 H14.5 V7 M6.5 7 L7.5 20 H16.5 L17.5 7 M10 11 V16.5 M14 11 V16.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19 15.5 A8 8 0 1 1 10.5 4 A6.5 6.5 0 0 0 19 15.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-squeeze" viewBox="0 0 24 24"><path d="M12 2.5 V8 M9 5.5 L12 8 L15 5.5 M12 21.5 V16 M9 18.5 L12 16 L15 18.5 M5 10.5 H19 M5 13.5 H19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M4 12 H18 M13 7 L18 12 L13 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="6" y="11" width="12" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 11 V8.5 a3 3 0 0 1 6 0 V11" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-nap" viewBox="0 0 34 20"><path d="M3 18 C2 11 7 8 13 8 L12 3 L16.5 6.5 C19 6.3 21 6.3 23 6.8 L26.5 3 L26.5 8.5 C30 10 32 13 31 18Z" fill="currentColor" opacity=".55"/><path d="M17 12.5 Q19 14 21 12.5 M24 12.5 Q26 14 28 12.5" fill="none" stroke="#F7F8F5" stroke-width="1.3" stroke-linecap="round"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5V5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 9 V13 L14.5 15 M10 3 H14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-tomato" viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 6.5 V3.5 M8.5 7 L12 8.5 L15.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-plan" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="11" width="11" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="17" width="14" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>
<script type="module" src="js/app.js"></script>
</body>
</html>
