<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miu 手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<style>
:root{
  --paper:#F7F8F5; --grid:#DDE6E9; --grid-strong:#C9D6DB;
  --ink:#2B2B33; --ink-soft:#6B6E78; --ink-faint:#A4A7AE;
  --shu:#E0533F;
  --matcha:#B5D3A7; --sora:#B3C8E6; --yamabuki:#F5D27A; --sakura:#F4BCC8; --fuji:#CDBFE3;
  --note:#FFF0A6; --note-fold:#EAD77C; --tatami:#D8D3A6;
  --hand:"LXGW WenKai Screen","Klee One","PingFang SC","Hiragino Sans GB",sans-serif;
  --round:"Zen Maru Gothic","PingFang SC",sans-serif;
  --ppm:1.2px;           /* timeline pixels per minute */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--hand);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px dashed var(--ink);outline-offset:3px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.app{height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr)}

/* ---------- header ---------- */
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:12px 20px 10px;border-bottom:1.5px solid var(--ink)}
.date{font-family:"Klee One",var(--hand);font-weight:600;font-size:30px;letter-spacing:.02em;line-height:1;min-width:3.2em;text-align:center}
.dow{display:inline-grid;place-items:center;width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;font-family:"Klee One",var(--hand);font-size:16px}
.nav{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-soft)}
.nav:hover{background:rgba(43,43,51,.07);color:var(--ink)}
.today-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--shu);visibility:hidden}
.today-btn.show{visibility:visible}
header .sp{flex:1}
.theme{position:relative}
.theme-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--ink);background:var(--paper)}
.theme-btn .sw{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--matcha) 0 33%,var(--sakura) 0 66%,var(--sora) 0)}
.theme-pop{position:absolute;right:0;top:46px;z-index:30;display:none;gap:10px;padding:12px;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.theme.open .theme-pop{display:flex}
.theme-pop .opt{width:58px;height:74px;border-radius:10px;border:1.5px solid var(--ink);position:relative;overflow:hidden}
.theme-pop .opt.on{box-shadow:0 0 0 3px var(--paper),0 0 0 4.5px var(--ink)}
.theme-pop .opt.grid{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/8px 8px,linear-gradient(90deg,var(--grid) 1px,var(--paper) 1px) 0 0/8px 8px}
.theme-pop .opt.grid::after{content:"";position:absolute;left:8px;right:8px;top:24px;height:10px;background:var(--matcha)}
.theme-pop .opt.locked{border-style:dashed;border-color:var(--ink-faint);background:#EFF0EC;display:grid;place-items:center;color:var(--ink-faint)}

/* ---------- left: tape rack + sticky notes ---------- */
.left{border-right:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.zone{position:relative;transition:background .15s}
body.dragging .zone[data-zone]{outline:2px dashed var(--ink-faint);outline-offset:-8px;border-radius:14px}
body.dragging .zone.hot{outline-color:var(--ink);background:rgba(43,43,51,.04)}
.rack{padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;border-bottom:1.5px dashed var(--ink-faint);max-height:52%;overflow:auto}
.roll{display:flex;align-items:center;cursor:grab;touch-action:none;user-select:none;width:max-content;max-width:100%}
.roll .core{flex:none;width:30px;height:30px;border-radius:50%;position:relative;z-index:1;border:1.5px solid var(--ink)}
.roll .core::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink)}
.roll .strip{height:24px;margin-left:-4px;padding:0 12px 0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;font-size:14px;
  clip-path:polygon(0 0,100% 0,96% 20%,100% 40%,96% 60%,100% 80%,96% 100%,0 100%)}
.roll.cushion .core{border-radius:8px;width:30px;height:22px;background:var(--sakura)}
.roll.cushion .core::after{display:none}
.roll.cushion .strip{background:none;clip-path:none;padding:0 6px;color:var(--ink-soft)}
.roll.add{cursor:pointer;color:var(--ink-faint)}
.roll.add .core{border-style:dashed;border-color:var(--ink-faint);display:grid;place-items:center;background:none}
.roll.add .core::after{display:none}
.roll.add:hover{color:var(--ink)}
.roll.add:hover .core{border-color:var(--ink)}
.roll input{height:26px;width:150px;border:0;border-bottom:1.5px solid var(--ink);background:transparent;font:inherit;margin-left:6px;outline:none}

.pile{flex:1;min-height:0;overflow:auto;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.note{position:relative;min-height:80px;padding:10px 10px 18px;background:var(--note);cursor:grab;touch-action:none;user-select:none;font-size:14px;line-height:1.35;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);filter:drop-shadow(0 1.5px 0 rgba(43,43,51,.18))}
.note::after{content:"";position:absolute;right:0;bottom:0;width:14px;height:14px;background:linear-gradient(135deg,var(--note-fold) 50%,transparent 50%)}
.note:nth-child(3n+1){transform:rotate(-1.6deg)} .note:nth-child(3n+2){transform:rotate(1.2deg)} .note:nth-child(3n){transform:rotate(-.6deg)}
.note .len{position:absolute;left:10px;bottom:8px;height:3px;background:var(--ink);border-radius:2px;opacity:.55}
.note.add{background:transparent;filter:none;clip-path:none;border:1.5px dashed var(--ink-faint);display:grid;place-items:center;color:var(--ink-faint);cursor:text;transform:none}
.note.add::after{display:none}
.note.add:hover{color:var(--ink);border-color:var(--ink)}
.note.add input{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);outline:none;align-self:start}

/* ---------- center: 24h timeline ---------- */
.center{min-height:0;overflow:auto;position:relative}
.lanes-head{position:sticky;top:0;z-index:20;display:flex;height:34px;align-items:center;background:var(--paper);border-bottom:1px solid var(--grid-strong);padding-left:60px;padding-right:12px;color:var(--ink-soft)}
.lanes-head .lh-plan{flex:1;padding-left:8px}
.lanes-head .lh-act{width:var(--act-w,36%);padding-left:12px}
.tl-wrap{position:relative;padding:22px 12px 60px 0}
.tl{position:relative;margin-left:60px;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/18px 18px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/18px 18px}
.hr{position:absolute;left:-60px;right:0;height:0;border-top:1px solid var(--grid-strong)}
.hr span{position:absolute;left:0;top:-11px;width:46px;text-align:right;font-family:"Klee One",var(--hand);font-size:16px;color:var(--ink-soft)}
.lane-plan{position:absolute;left:8px;right:calc(var(--act-w,36%) + 8px);top:0;bottom:0}
.lane-act{position:absolute;right:0;width:var(--act-w,36%);top:0;bottom:0;border-left:1.5px dashed var(--grid-strong);background:rgba(255,255,255,.35);cursor:crosshair}

.blk{position:absolute;left:0;right:0;touch-action:none;user-select:none;cursor:grab}
.blk .bg{position:absolute;inset:1.5px 0;background:var(--c);opacity:.92}
.blk.k-routine .bg{clip-path:polygon(0 0,100% 0,99% 25%,100% 50%,99% 75%,100% 100%,0 100%,1% 75%,0 50%,1% 25%);
  background-image:linear-gradient(90deg,rgba(255,255,255,.22) 0 1px,transparent 1px 100%);background-size:6px 100%}
.blk.k-popup .bg{background:var(--note);opacity:1;clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);filter:drop-shadow(0 1px 0 rgba(43,43,51,.2))}
.blk.k-popup::after{content:"";position:absolute;right:0;bottom:1.5px;width:12px;height:12px;background:linear-gradient(135deg,var(--note-fold) 50%,transparent 50%);pointer-events:none}
.blk .txt{position:relative;display:flex;align-items:baseline;gap:10px;padding:5px 12px;font-size:15px;line-height:1.3;min-width:0}
.blk .ti{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;outline:none}
.blk .ti[contenteditable=true]{background:rgba(255,255,255,.7);border-radius:3px;padding:0 3px;cursor:text}
.blk .tm{font-family:"Klee One",var(--hand);font-size:12px;color:var(--ink-soft);white-space:nowrap}
.blk .tally{font-family:"Klee One",var(--hand);color:var(--shu);font-size:14px;letter-spacing:1px;margin-left:auto}
.blk .got{position:absolute;left:12px;right:12px;bottom:5px;height:3px;border-radius:2px;background:rgba(43,43,51,.12);overflow:hidden;pointer-events:none}
.blk .got i{display:block;height:100%;background:var(--ink)}
.blk.compact .txt{padding:1px 12px;font-size:13px}
.blk.compact .tm,.blk.compact .got{display:none}
.blk.done .bg{opacity:.38}
.blk.done .ti{color:var(--ink-soft)}
.blk.cur{z-index:2}
.blk.cur .bg{box-shadow:inset 3px 0 0 var(--ink)}
.blk.running .bg{box-shadow:inset 5px 0 0 var(--shu)}
.blk .over{position:absolute;left:0;right:0;bottom:0;border-top:1.5px dashed var(--shu);background:repeating-linear-gradient(-45deg,rgba(224,83,63,.32) 0 3px,transparent 3px 8px)}
.blk.sel{z-index:5;outline:2px dashed var(--ink);outline-offset:1px;border-radius:2px}
.blk .acts{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:none;gap:4px;z-index:3}
.blk.sel .acts{display:flex}
.blk .acts button{width:30px;height:30px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);display:grid;place-items:center}
.blk .acts button:hover,.blk .acts button.on{background:var(--ink);color:var(--paper)}
.blk .pinmark{position:absolute;left:-11px;top:-8px;width:22px;height:22px;color:#3D5A8A;display:none;z-index:3}
.blk.pinned .pinmark{display:block}
.blk.pinned .bg{opacity:1}
.blk.clash .bg{box-shadow:inset 0 0 0 2px var(--shu)}
.blk .grip{position:absolute;left:30%;right:30%;bottom:-4px;height:9px;cursor:ns-resize;z-index:4}
.blk .grip::after{content:"";position:absolute;left:50%;top:3px;width:26px;margin-left:-13px;height:3px;border-radius:2px;background:var(--ink);opacity:0;transition:opacity .15s}
.blk:hover .grip::after,.blk.sel .grip::after{opacity:.45}
.blk .stamp{position:absolute;right:18px;top:50%;width:44px;height:44px;margin-top:-22px;color:var(--shu);transform:rotate(-14deg);pointer-events:none;z-index:2;opacity:.85}
.blk.compact .stamp{width:28px;height:28px;margin-top:-14px}
.blk.squeezed .txt::before{content:"";flex:none;width:10px;height:10px;align-self:center;background:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 3.5px);opacity:.6}
.blk.k-cushion .bg{background:var(--sakura);opacity:.55;border-radius:10px;border:1.5px dashed var(--ink-soft)}
.blk.k-cushion .nap{position:absolute;left:50%;top:50%;width:34px;height:20px;margin:-10px 0 0 -17px;color:var(--ink-soft)}
.blk.k-cushion.thin .nap{display:none}
.blk.k-cushion.spent .bg{background:none;border:0;border-top:2px dashed var(--shu);border-radius:0;opacity:1}

/* actual lane: what really happened */
.log{position:absolute;left:8px;right:8px;border:1.5px solid var(--ink);border-radius:4px;cursor:grab;touch-action:none;user-select:none;
  background:repeating-linear-gradient(-50deg,var(--c) 0 4px,rgba(255,255,255,.55) 4px 7px);overflow:hidden}
.log .lt{position:absolute;left:8px;top:2px;right:8px;font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,rgba(247,248,245,.9),rgba(247,248,245,.6));padding:0 4px;border-radius:3px;width:max-content;max-width:calc(100% - 16px)}
.log .lt b{font-weight:normal;font-family:"Klee One",var(--hand);color:var(--ink-soft);margin-left:6px}
.log.tiny .lt{display:none}
.log .h{position:absolute;left:0;right:0;height:7px;cursor:ns-resize}
.log .h.top{top:-2px}.log .h.bot{bottom:-2px}
.log.sel{outline:2px dashed var(--ink);outline-offset:2px;z-index:3}
.log .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--paper);border:1.5px solid var(--ink);display:none;place-items:center}
.log.sel .x{display:grid}
.log .x svg{width:12px;height:12px}
.log.live{border-color:var(--shu);border-style:dashed;cursor:default;animation:livePulse 1.4s ease-in-out infinite}
@keyframes livePulse{50%{opacity:.55}}
.draft{position:absolute;left:8px;right:8px;border:2px dashed var(--ink);border-radius:4px;background:rgba(43,43,51,.06);pointer-events:none}
.draft span{position:absolute;left:6px;top:2px;font-family:"Klee One",var(--hand);font-size:13px}

.now{position:absolute;left:-60px;right:0;height:0;border-top:2px solid var(--shu);z-index:6;pointer-events:none}
.now .t{position:absolute;left:0;top:-10px;width:50px;text-align:right;padding-right:4px;background:var(--paper);font-family:"Klee One",var(--hand);font-weight:600;font-size:14px;color:var(--shu)}
.endline{position:absolute;left:-60px;right:0;border-top:2px solid var(--ink)}
.ins{position:absolute;left:0;width:calc(100% - var(--act-w,36%) - 8px);height:0;border-top:3px solid var(--ink);z-index:8;pointer-events:none;display:none}
.ins span{position:absolute;left:-56px;top:-12px;font-family:"Klee One",var(--hand);font-weight:600;font-size:14px;background:var(--paper);padding:0 3px}
.ins::before{content:"";position:absolute;left:-5px;top:-6.5px;width:10px;height:10px;border-radius:50%;background:var(--ink)}

.tray{position:absolute;left:-52px;right:0;min-height:84px;padding:14px 14px 14px 56px;border:1.5px dashed var(--ink-faint);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray .moon{position:absolute;left:14px;top:50%;margin-top:-14px;width:28px;height:28px;color:var(--ink-soft)}
.tray.has{border-color:var(--shu);background:rgba(224,83,63,.05)}
.tray .mini{height:28px;padding:0 12px;display:flex;align-items:center;font-size:13px;cursor:grab;touch-action:none;user-select:none;background:var(--c);opacity:.75}
.tray .mini.k-popup{background:var(--note)}
.tray .tbtns{margin-left:auto;display:flex;gap:8px}
.tray .tbtns button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.tray .tbtns button:hover{background:var(--ink);color:var(--paper)}
.tray .tbtns svg{width:20px;height:20px}

/* ---------- right: Miu + timer ---------- */
.right{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;padding:20px 18px;gap:12px;overflow:auto}
.window{position:relative;width:250px;height:250px;flex:none}
.window svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--ink);stroke-width:1.5}
.ring .prog{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke .3s}
.stage{position:absolute;inset:16px;border-radius:50%;overflow:hidden;border:1.5px solid var(--ink);
  background:linear-gradient(90deg,transparent 49.6%,rgba(43,43,51,.07) 49.6% 50.4%,transparent 50.4%),
    linear-gradient(transparent 32.6%,rgba(43,43,51,.07) 32.6% 33.4%,transparent 33.4%,transparent 65.6%,rgba(43,43,51,.07) 65.6% 66.4%,transparent 66.4%),#FBFBF7}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;background:var(--tatami);border-top:1.5px solid rgba(43,43,51,.25)}
#miuHost{position:absolute;left:9%;right:9%;top:11%;bottom:6%;z-index:1}
.modes{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.modes button{width:46px;height:30px;display:grid;place-items:center;color:var(--ink-soft)}
.modes button[aria-checked=true]{background:var(--ink);color:var(--paper)}
.modes button:disabled{opacity:.4}
.timer{font-family:var(--round);font-weight:700;font-size:42px;letter-spacing:.04em;line-height:1;font-variant-numeric:tabular-nums}
.timer.break{color:#5E8F5A}
.ctrls{display:flex;gap:14px;align-items:center}
.ctrls button{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;background:var(--paper)}
.ctrls button svg{width:22px;height:22px}
.ctrls button.go{background:var(--ink);color:var(--paper)}
.ctrls button:disabled{opacity:.3}
.ctrls button.nudge{animation:nudge .4s ease 2}
@keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.target{min-height:28px;display:flex;align-items:center;gap:8px;font-size:15px}
.target .chip{width:18px;height:12px;background:var(--c)}
.today{margin-top:4px;width:100%;max-width:270px;border-top:1.5px dashed var(--ink-faint);padding-top:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.today .sum{font-family:var(--round);font-weight:700;font-size:22px;display:flex;align-items:center;gap:8px}
.today .sum svg{width:18px;height:18px;color:var(--ink-soft)}
.today .tallybig{font-family:"Klee One",var(--hand);font-weight:600;font-size:28px;color:var(--shu);letter-spacing:4px;min-height:36px}
.today .stamps{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;color:var(--shu);min-height:24px}
.today .stamps svg{width:24px;height:24px;opacity:.85}

/* ---------- popovers, drag ---------- */
.pop{position:fixed;z-index:120;background:var(--paper);border:1.5px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:10px;min-width:180px;max-width:260px}
.pop .pick{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.pop .pick button{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;text-align:left}
.pop .pick button:hover{background:rgba(43,43,51,.07)}
.pop .pick .chip{flex:none;width:16px;height:11px;background:var(--c)}
.pop form{display:flex;align-items:center;gap:6px}
.pop input[type=time]{font:inherit;font-family:var(--round);border:1.5px solid var(--ink);border-radius:6px;padding:3px 6px;background:#fff}
.pop .ok{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none}
.pop .empty{color:var(--ink-soft);font-size:14px;padding:4px 6px}
.ghost{position:fixed;z-index:100;pointer-events:none;opacity:.92;filter:drop-shadow(3px 4px 0 rgba(43,43,51,.25))}
.lifted{opacity:.25}
.trash{position:fixed;left:50%;bottom:24px;margin-left:-32px;width:64px;height:64px;border-radius:50%;border:1.5px dashed var(--ink);background:var(--paper);display:none;place-items:center;z-index:50}
.trash svg{width:28px;height:28px}
body.dragging .trash{display:grid}
.trash.hot{background:var(--shu);color:#fff;border-style:solid}
body.dragging,body.dragging *{cursor:grabbing!important}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1100px){.app{grid-template-columns:230px minmax(0,1fr) 270px}.window{width:210px;height:210px}}

</style>
<script>
// Pixel Miu — the approved comnyang-style Miu, animated, with moods and pet / tap interactions.
// Usage:  const miu = MiuPixel.mount(element);  miu.setMode('idle' | 'focus' | 'break' | 'worried');  miu.cheer();

const INK = '#2B2B33', DARK = '#1E1E22', WHITE = '#FFFFFF', PALE = '#D3D5D9', PINK = '#E88A9A',
      RED = '#E0533F', WOOD = '#C99E6A', WOOD2 = '#A87E4E', KEY = '#E4E6E8', KEY2 = '#B9BDC2',
      CUSH = '#F4BCC8', SWEAT = '#BFE0F2', HEART = '#F28CA6';
const MX = x => 27 - x; // the cat is symmetric around x = 13.5

/* ---------- pixel helpers ---------- */
function paths(cells){
  const by = {};
  for (const [x, y, c] of cells) (by[c] = by[c] || []).push([x, y]);
  let s = '';
  for (const c in by){
    const pts = by[c].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    let d = '', i = 0;
    while (i < pts.length){
      const [x, y] = pts[i]; let n = 1;
      while (i + n < pts.length && pts[i+n][1] === y && pts[i+n][0] === x + n) n++;
      d += `M${x} ${y}h${n}v1h-${n}z`; i += n;
    }
    s += `<path fill="${c}" d="${d}"/>`;
  }
  return s;
}
const g = (cls, cells) => `<g class="${cls}">${paths(cells)}</g>`;
const rect = (x, y, w, h, c) => { const o = []; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) o.push([x + i, y + j, c]); return o; };
const K = (pts, c = DARK) => pts.map(([x, y]) => [x, y, c]);
const sym = cells => cells.concat(cells.map(([x, y, c]) => [MX(x), y, c]));
const shift = (cells, dx, dy) => cells.map(([x, y, c]) => [x + dx, y + dy, c]);
const rows = (strs, x0, y0, pal) => { const o = []; strs.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) o.push([x0 + i, y0 + j, pal[ch]]); })); return o; };

/* ---------- parts ---------- */
const Z = D.zones;  // absolute pixels per comnyang zone: tail, body, legFl, legFr, earL, earR, head
const WHISKERS = [...rect(0,14,5,1,DARK), ...rect(23,14,5,1,DARK), ...rect(0,17,6,1,DARK), ...rect(23,17,6,1,DARK)];
const PUP_L = rect(8,11,3,3,DARK), PUP_R = rect(17,11,3,3,DARK);
const HAPPY_L = K([[7,13],[8,12],[9,11],[10,12],[11,13]]);
const FACES = {
  open:   {still:[], look:[...PUP_L, ...PUP_R]},
  focus:  {still:sym(K([[7,11],[8,11],[9,11],[10,11],[11,11]])), look:[...rect(8,12,3,2,DARK), ...rect(17,12,3,2,DARK)]}, // lids down: locked in
  worry:  {still:sym(K([[7,9],[8,9],[9,8],[10,8]])), look:[...PUP_L, ...PUP_R]},                                         // brows up
  wink:   {still:HAPPY_L, look:PUP_R},                                                                                     // tap: a cheeky wink
  blink:  K([[8,12],[9,12],[10,12],[17,12],[18,12],[19,12]]),
  happy:  sym(HAPPY_L),
  sleep:  sym(K([[7,11],[8,12],[9,13],[10,12],[11,11]])),
  squint: sym(K([[8,11],[9,12],[8,13]])),
};
// yawn: the little ω becomes an open "o"
const MOUTH_OPEN = [...[[11,15],[15,15],[11,16],[15,16],[13,14]].map(([x, y]) => [x, y, WHITE]),
  ...K([[12,15],[13,15],[14,15],[12,16],[14,16],[12,17],[13,17],[14,17]]), [13,16,PINK]];
const SWEAT_DROP = K([[25,4],[24,5],[25,5],[24,6],[25,6]], SWEAT);
const BAND = [...D.band.map(([x, y]) => [x, y, WHITE]), ...rect(13,6,2,2,RED),
  ...K([[25,6],[26,5],[27,4],[25,7],[26,8],[27,9]], WHITE)];
const DESK = [...rect(6,22,16,2,KEY), ...K([[7,23],[9,23],[11,23],[13,23],[15,23],[17,23],[19,23]], KEY2),
  ...rect(1,24,26,1,WOOD), ...rect(1,25,26,1,WOOD2), ...rect(3,26,2,10,WOOD2), ...rect(23,26,2,10,WOOD2)];
const PAWS_A = [...rect(8,20,3,2,PALE), ...rect(17,21,3,2,PALE)];   // left paw up
const PAWS_B = [...rect(8,21,3,2,PALE), ...rect(17,20,3,2,PALE)];   // right paw up
const FLOP_DX = -3, FLOP_DY = 9;
const CUSHION = [...rect(-1,34,38,1,CUSH), ...rect(-2,35,40,1,CUSH)];
const FLOP_PAWS = [...rect(5,32,4,2,PALE), ...rect(12,32,4,2,PALE)];
const HEART_AT = (x, y) => rows(['.H.H.','HHHHH','.HHH.','..H..'], x, y, {H:HEART});
const ZED_AT = (x, y) => rows(['WWWW','..W.','.W..','WWWW'], x, y, {W:WHITE});

/* ---------- markup ---------- */
let uid = 0;
function faces(dx = 0, dy = 0){
  return Object.entries(FACES).map(([k, v]) => Array.isArray(v)
    ? g('face f-' + k, shift(v, dx, dy))
    : `<g class="face f-${k}">${paths(shift(v.still, dx, dy))}<g class="look">${paths(shift(v.look, dx, dy))}</g></g>`).join('');
}
function headGroup(dx = 0, dy = 0, extra = ''){
  const s = c => shift(c, dx, dy);
  return `<g class="head">${g('whiskers', s(WHISKERS))}${g('ear-l', s(Z.earL))}${g('ear-r', s(Z.earR))}${paths(s(Z.head))}${faces(dx, dy)}${extra}</g>`;
}
function svgMarkup(){
  const id = 'miuo' + (uid++);
  const sit = `<g class="pose p-sit">
      ${g('tail sway', Z.tail)}${g('body', Z.body)}${g('legs', [...Z.legFl, ...Z.legFr])}
      ${headGroup(0, 0, g('fx-mouth', MOUTH_OPEN) + g('fx-sweat', SWEAT_DROP))}
    </g>`;
  const work = `<g class="pose p-work">
      ${g('tail sway', Z.tail)}${g('body', Z.body.filter(([, y]) => y <= 23))}
      ${headGroup(0, 0, g('band', BAND))}
      ${g('desk', DESK)}${g('paws pA', PAWS_A)}${g('paws pB', PAWS_B)}
    </g>`;
  const flop = `<g class="pose p-flop">
      ${g('cushion', CUSHION)}${g('body breathe', D.flopBody)}${g('tail', D.flopTail)}
      ${headGroup(FLOP_DX, FLOP_DY)}${g('paws', FLOP_PAWS)}
    </g>`;
  return `<svg class="mp" viewBox="-6 -7 46 46" shape-rendering="crispEdges" role="img" aria-label="Miu">
    <defs><filter id="${id}" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="a1"/>
      <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="a2"/>
      <feFlood flood-color="${INK}"/><feComposite in2="a2" operator="in" result="ink"/>
      <feFlood flood-color="${WHITE}"/><feComposite in2="a1" operator="in" result="edge"/>
      <feMerge><feMergeNode in="ink"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g class="hop"><g filter="url(#${id})">
      ${sit}${work}${flop}
      <g class="fx-hearts">${g('ht h1', HEART_AT(19,-5))}${g('ht h2', HEART_AT(3,-3))}${g('ht h3', HEART_AT(24,0))}</g>
      <g class="fx-zzz">${g('z z1', ZED_AT(20,8))}${g('z z2', ZED_AT(24,3))}${g('z z3', ZED_AT(28,-2))}</g>
    </g></g>
  </svg>`;
}

const CSS = `

.mp .pose,.mp .face,.mp [class^="fx-"]{display:none}

.mp.purr .head{animation:mpPurr .16s steps(2) infinite}
@keyframes mpPurr{50%{transform:translate(0,.3px)}}

.mp .pA{animation:mpPawA .36s steps(1) infinite}

@keyframes mpPawA{0%{opacity:1}50%{opacity:0}}

.mp .breathe{animation:mpBreathe 2.8s steps(1) infinite}

/* ---------- controller ---------- */
function mount(host){
  if (!document.getElementById('miu-pixel-css')){
    const st = document.createElement('style'); st.id = 'miu-pixel-css'; st.textContent = CSS; document.head.appendChild(st);
  }
  host.innerHTML = svgMarkup();
  const svg = host.querySelector('svg'), hop = svg.querySelector('.hop');
  let mode = 'idle', override = null, overrideTimer = 0, idleTimer = 0, yawnTimer = 0, dozing = false;
  let petting = false, petDist = 0, lastPt = null, purrStop = 0, down = null;

  const looks = () => svg.querySelectorAll('.look');
  function apply(){
    const v = override || base();
    svg.dataset.pose = v.pose; svg.dataset.face = v.face;
    for (const fx of ['mouth','sweat','hearts','zzz','purr']) svg.classList.toggle(fx, !!v[fx]);
  }
  function base(){
    if (mode === 'focus') return {pose:'work', face:'focus', hearts:petting, purr:false};
    if (mode === 'break') return {pose:'flop', face:'sleep', zzz:true, hearts:petting, purr:petting};
    if (mode === 'worried') return {pose:'sit', face: petting ? 'happy' : 'worry', sweat:!petting, hearts:petting, purr:petting};
    if (petting) return {pose: dozing ? 'flop' : 'sit', face:'happy', hearts:true, purr:true};
    if (dozing) return {pose:'sit', face:'sleep', zzz:true};
    return {pose:'sit', face:'open'};
  }
  function flash(v, ms){
    override = v; apply(); clearTimeout(overrideTimer);
    overrideTimer = setTimeout(() => { override = null; apply(); }, ms);
  }
  function doHop(){ hop.classList.remove('go'); void hop.getBoundingClientRect(); hop.classList.add('go'); }
  function wake(){
    dozing = false; clearTimeout(idleTimer); clearTimeout(yawnTimer);
    if (mode === 'idle'){
      idleTimer = setTimeout(() => { dozing = true; apply(); }, 90000);
      yawnTimer = setTimeout(function y(){ if (mode === 'idle' && !override && !petting && !dozing) flash({pose:'sit', face:'squint', mouth:true}, 1400);
        yawnTimer = setTimeout(y, 30000 + Math.random()*30000); }, 25000 + Math.random()*20000);
    }
  }

  // pet: press and stroke across Miu. tap: a little hop and a wink.
  svg.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, moved:0}; lastPt = down; petDist = 0; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!down) return;
    const d = Math.hypot(e.clientX - lastPt.x, e.clientY - lastPt.y); lastPt = {x:e.clientX, y:e.clientY};
    down.moved += d; petDist += d;
    if (petDist > 24 && !petting){ petting = true; wake(); apply(); }
    clearTimeout(purrStop);
  });
  const release = () => {
    if (!down) return;
    const tapped = down.moved < 6; down = null;
    if (petting){ purrStop = setTimeout(() => { petting = false; apply(); }, 700); return; }
    if (tapped){
      const wasDozing = dozing; wake(); doHop();
      if (mode === 'break' || wasDozing) flash({pose: mode === 'break' ? 'flop' : 'sit', face:'open', zzz:false}, 900);
      else if (mode === 'focus') flash({pose:'work', face:'happy', hearts:true}, 900);
      else flash({pose:'sit', face:'wink', hearts:true}, 1100);
    }
  };
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  // eyes follow the pointer, one pixel at a time; left alone, Miu side-eyes the room
  let lastPointer = 0;
  const lookAt = ox => looks().forEach(l => l.style.transform = `translate(${ox}px,0)`);
  document.addEventListener('pointermove', e => {
    lastPointer = performance.now();
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width/2);
    lookAt(Math.abs(dx) < r.width*0.25 ? 0 : Math.sign(dx));
  });

    if (performance.now() - lastPointer > 4000){
      lookAt([-1, 1, -1, 0][Math.floor(Math.random()*4)]);
      setTimeout(() => { if (performance.now() - lastPointer > 4000) lookAt(0); }, 1400 + Math.random()*900);
    }
    setTimeout(glance, 5000 + Math.random()*5000);
  })();

  wake(); apply();
  return {
    setMode(m){
      if (m === mode) return;
      const prev = mode; mode = m; wake();
      clearTimeout(overrideTimer); override = null;
      if (m === 'break' && prev === 'focus') flash({pose:'sit', face:'squint', mouth:true}, 1400); // big yawn first

    show(v){ clearTimeout(overrideTimer); override = v; apply(); }, // pin a look (for previews)

    get mode(){ return mode; },
    el: svg,
  };

})();

<script>
const __store = (() => {
// App state: tape templates, sticky notes, per-day plans and time logs, the running timer.
// Everything is saved to this browser's localStorage after each change.

const KEY = 'miu-techo-v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyToDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const shiftKey = (k, n) => { const d = keyToDate(k); d.setDate(d.getDate() + n); return dayKey(d); };
const COLORS = ['matcha', 'sora', 'yamabuki', 'sakura', 'fuji'];

function fresh(){
  const t = (title, dur, color) => ({ id: uid(), title, dur, color });
  return {
    version: 1,
    templates: [
      t('晨间拉伸', 20, 'matcha'), t('深度工作', 90, 'sora'), t('看书', 30, 'matcha'), t('健身', 45, 'sakura'),
      t('学日语', 45, 'fuji'), t('复盘', 15, 'yamabuki'), t('陪 Miu 玩', 20, 'sakura'),
      { id: 'cushion', title: '', dur: 15, color: 'sakura', cushion: true },
    ],
    inbox: [],
    days: {},
    timer: null, // {itemId, day, mode:'stopwatch'|'pomodoro', phase:'focus'|'break', phaseStart:ms}
    settings: { focusMin: 25, breakMin: 5, timerMode: 'stopwatch' },
  };
}

function load(){
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.version === 1) return s;
  } catch (e) { /* private mode or broken data: start fresh */ }
  return fresh();
}

let state = load();
const subs = new Set();
let saveTimer = 0;

const getState = () => state;
function getDay(key){
  return state.days[key] || { flowStart: 8 * 60, items: [], logs: [] };
}
// day() creates the day record on first write
function day(key){
  return state.days[key] || (state.days[key] = { flowStart: 8 * 60, items: [], logs: [] });
}
function subscribe(fn){ subs.add(fn); return () => subs.delete(fn); }
function update(fn){
  fn(state);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }, 150);
  subs.forEach(f => f());
}

return {uid, dayKey, keyToDate, shiftKey, COLORS, getState, getDay, day, subscribe, update};
})();
const __schedule = (() => {
// Flexible scheduling for one day's plan.
// - Flowing blocks keep only their order and length; they are laid out back to back from day.flowStart.
// - Pinned blocks keep their clock time; flowing blocks jump over them.
// - The first unfinished block that should already have started is "current": it stretches to now.
// - Cushions (buffers) absorb that overrun first: a cushion ends where it ended in the plan, or at once.
// - Anything pushed past midnight lands in the overflow tray.

const DAY_END = 24 * 60;

function skip(t, d, pins){
  let moved = true;
  while (moved){
    moved = false;
    for (const p of pins) if (t < p.e && t + d > p.s){ t = p.e; moved = true; }
  }
  return t;
}

// now: minutes since midnight for today, Infinity for past days, -Infinity for future days
function place(day, now, baseline){
  const pins = day.items.filter(x => x.pinned).map(x => ({ x, s: x.start, e: x.start + x.dur }));
  const res = new Map();
  let t = day.flowStart, cur = null;
  for (const p of pins) res.set(p.x.id, { s: p.s, e: p.e });
  for (const it of day.items){
    if (it.pinned) continue;
    if (it.kind === 'cushion'){
      t = skip(t, Math.max(1, it.dur), pins);
      if (baseline){
        const b = baseline.get(it.id);
        const e = Math.max(t, b ? b.e : t + it.dur);
        res.set(it.id, { s: t, e }); t = e;
      } else { res.set(it.id, { s: t, e: t + it.dur }); t += it.dur; }
      continue;
    }
    t = skip(t, it.dur, pins);
    const s = t; let e = s + (it.done ? (it.actual ?? it.dur) : it.dur);
    if (baseline && !it.done && !cur && s <= now && Number.isFinite(now)){ cur = it; e = Math.max(e, now); }
    res.set(it.id, { s, e }); t = e;
  }
  return { res, cur };
}

function layout(day, now){
  const base = place(day, now, null).res;
  const { res, cur } = place(day, now, base);
  const overflow = day.items.filter(it => !it.pinned && it.kind !== 'cushion' && res.get(it.id).e > DAY_END + 0.01);
  const clashes = new Set();
  for (const p of day.items.filter(x => x.pinned)){
    for (const it of day.items){
      if (it.pinned || it.kind === 'cushion') continue;
      const r = res.get(it.id);
      if (r.s < p.start + p.dur && r.e > p.start + 0.01) clashes.add(p.id);
    }
  }
  return { res, cur, overflow, clashes };
}

const minOf = it => it.min || Math.max(10, Math.round(it.dur * 0.5 / 5) * 5);

// shorten later, unstarted blocks (last first) toward their minimum until nothing overflows
function squeeze(day, now){
  for (let guard = 0; guard < 200; guard++){
    const L = layout(day, now);
    if (!L.overflow.length) return;
    const cand = [...day.items].reverse().find(x => !x.done && !x.pinned && x.kind !== 'cushion'
      && L.cur !== x && x.dur > minOf(x) && L.res.get(x.id).s >= (Number.isFinite(now) ? now : -1));
    if (!cand) return;
    cand.dur = Math.max(minOf(cand), cand.dur - 5); cand.squeezed = true;
  }
}

// where a block dropped at minute T should go in the flowing order
function insertIndex(day, L, T, excl){
  for (let i = 0; i < day.items.length; i++){
    const x = day.items[i];
    if (x === excl || x.pinned) continue;
    const r = L.res.get(x.id);
    if (r && r.s >= T - 1) return i;
  }
  return day.items.length;
}

return {DAY_END, layout, minOf, squeeze, insertIndex};
})();
const __app = (() => {
const { getState, getDay, day, update, subscribe, uid, dayKey, keyToDate, shiftKey, COLORS } = __store;
const { layout, squeeze, insertIndex, DAY_END } = __schedule;

/* ---------- helpers ---------- */
const PPM = 1.2;                       // timeline pixels per minute (keep in sync with --ppm)
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const fmt = m => { m = Math.max(0, Math.round(m)); return pad(Math.floor(m / 60)) + ':' + pad(m % 60); };
const dur = m => { m = Math.round(m); return Math.floor(m / 60) + ':' + pad(m % 60); };
const r5 = m => Math.round(m / 5) * 5;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tallyStr = n => '正'.repeat(Math.floor(n / 5)) + ['', '一', '丅', '下', '止'][n % 5];
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const todayKey = () => dayKey(new Date());
const nowFor = key => key === todayKey() ? nowMin() : key < todayKey() ? Infinity : -Infinity;
const colorOf = it => it.kind === 'popup' ? 'yamabuki' : (it.color || 'sora');
const loggedFor = (D, id) => D.logs.filter(l => l.itemId === id).reduce((a, l) => a + (l.end - l.start), 0);

let viewKey = todayKey();
let sel = null, selLog = null, L = null, lastMin = -1;
const plan = $('#plan'), act = $('#act'), tl = $('#tl'), center = $('#center'), pop = $('#pop');
const miu = window.MiuPixel ? window.MiuPixel.mount($('#miuHost')) : null;

/* ---------- timer ---------- */
function addLogMs(S, T, a, b){
  if (b - a < 60000) return;                       // under a minute: not worth a record
  const D = day(T.day), base = keyToDate(T.day).getTime();
  const s = Math.round((a - base) / 60000), e = Math.min(DAY_END, Math.round((b - base) / 60000));
  if (e - s < 1) return;
  const it = D.items.find(x => x.id === T.itemId);
  D.logs.push({ id: uid(), itemId: T.itemId, title: it ? it.title : '', color: it ? colorOf(it) : 'sora', start: s, end: e });
}
function closeTimer(S, endMs){
  const T = S.timer; if (!T) return;
  if (T.mode === 'stopwatch' || T.phase === 'focus') addLogMs(S, T, T.phaseStart, endMs);
  S.timer = null;
}
function startTimer(itemId){
  const k = todayKey();
  if (viewKey !== k){ viewKey = k; render(); scrollToNow(); }
  sel = null;
  update(S => {
    if (S.timer) closeTimer(S, Date.now());
    const D = day(k), it = D.items.find(x => x.id === itemId);
    if (!it || it.kind === 'cushion') return;
    it.done = false;
    // doing this now: it becomes the current block
    const Lx = layout(D, nowMin());
    if (!it.pinned && Lx.cur !== it){
      D.items.splice(D.items.indexOf(it), 1);
      const anchor = Lx.cur || D.items.find(x => !x.done && !x.pinned && x.kind !== 'cushion');
      D.items.splice(anchor ? D.items.indexOf(anchor) : D.items.length, 0, it);
    }
    // it was planned for later but you're starting now: the day's flow starts now
    const firstFlow = D.items.find(x => !x.pinned);
    if (firstFlow === it && D.flowStart > nowMin()) D.flowStart = Math.floor(nowMin() / 5) * 5;
    S.timer = { itemId, day: k, mode: S.settings.timerMode, phase: 'focus', phaseStart: Date.now() };
  });
}
function stopTimer(){ update(S => closeTimer(S, Date.now())); }
function tick(){
  const S = getState(), T = S.timer;
  if (T && T.mode === 'pomodoro'){
    const focus = S.settings.focusMin * 60000, brk = S.settings.breakMin * 60000, now = Date.now();
    if (T.phase === 'focus' && now - T.phaseStart >= focus){
      update(S2 => {
        const t = S2.timer, end = t.phaseStart + focus;
        addLogMs(S2, t, t.phaseStart, end);
        const it = day(t.day).items.find(x => x.id === t.itemId); if (it) it.tally = (it.tally || 0) + 1;
        t.phase = 'break'; t.phaseStart = end;
      });
    } else if (T.phase === 'break' && now - T.phaseStart >= brk){
      update(S2 => { S2.timer = null; });
    }
  }
  renderTimer();
  const m = Math.floor(nowMin());
  if (m !== lastMin && !drag && !rez && !logDrag && !draft){ lastMin = m; render(); }
}

/* ---------- render ---------- */
function render(){
  const D = getDay(viewKey), now = nowFor(viewKey);
  L = layout(D, now);
  renderHeader(); renderRack(); renderPile(); renderTimeline(D, now); renderSide(D); renderTimer();
  if (miu) miu.setMode(miuMode());
}
function renderHeader(){
  const d = keyToDate(viewKey);
  $('#date').textContent = (d.getMonth() + 1) + '.' + d.getDate();
  $('#dow').textContent = '日月火水木金土'[d.getDay()];
  $('#todayBtn').classList.toggle('show', viewKey !== todayKey());
}
function renderRack(){
  const S = getState();
  $('#rack').innerHTML = S.templates.map(tp => tp.cushion
    ? `<div class="roll cushion" data-drag="tpl" data-id="${tp.id}"><span class="core"></span><span class="strip"><svg style="width:34px;height:20px;color:var(--ink-soft)"><use href="#i-nap"/></svg></span></div>`
    : `<div class="roll" data-drag="tpl" data-id="${tp.id}"><span class="core" style="background:var(--${tp.color})"></span><span class="strip" style="background:var(--${tp.color});width:${Math.min(200, 52 + tp.dur * 1.6)}px">${esc(tp.title)}</span></div>`
  ).join('') + `<div class="roll add" id="addTpl" tabindex="0" aria-label="新胶带"><span class="core"><svg class="i" style="width:14px;height:14px"><use href="#i-plus"/></svg></span></div>`;
}
function renderPile(){
  const S = getState();
  $('#pile').innerHTML = `<div class="note add" id="addNote" tabindex="0" aria-label="新便利贴"><svg class="i" style="width:26px;height:26px"><use href="#i-plus"/></svg></div>` +
    S.inbox.map(n => `<div class="note" data-drag="note" data-id="${n.id}">${esc(n.title)}<span class="len" style="width:${Math.min(90, n.dur * 1.2)}%"></span></div>`).join('');
}
function renderTimeline(D, now){
  const S = getState(), T = S.timer;
  tl.style.height = (DAY_END * PPM + 150) + 'px';
  let h = '';
  for (let hr = 0; hr <= 24; hr++) h += `<div class="hr" style="top:${hr * 60 * PPM}px"><span>${hr}</span></div>`;
  for (const it of D.items){
    const r = L.res.get(it.id);
    if (!it.pinned && r.e > DAY_END + 0.01) continue;
    h += blockHTML(D, it, r, T);
  }
  h += `<div class="endline" style="top:${DAY_END * PPM}px"></div>`;
  if (Number.isFinite(now)) h += `<div class="now" style="top:${now * PPM}px"><span class="t">${fmt(now)}</span></div>`;
  const of = L.overflow;
  h += `<div class="tray zone ${of.length ? 'has' : ''}" data-zone="tray" style="top:${DAY_END * PPM + 22}px">
      <svg class="moon"><use href="#i-moon"/></svg>
      ${of.map(it => `<div class="mini k-${it.kind}" data-drag="blk" data-id="${it.id}" style="--c:var(--${colorOf(it)})">${esc(it.title)}</div>`).join('')}
      ${of.length ? `<span class="tbtns"><button data-act="squeeze" aria-label="压缩之后的块"><svg class="i"><use href="#i-squeeze"/></svg></button><button data-act="tomorrow" aria-label="挪到明天"><svg class="i"><use href="#i-next"/></svg></button></span>` : ''}
    </div>`;
  plan.innerHTML = h;
  // actual lane: overlapping records sit side by side
  let a = '';
  const cols = logColumns(D.logs);
  for (const l of D.logs) a += logHTML(l, cols.get(l.id));
  if (T && T.day === viewKey && (T.mode === 'stopwatch' || T.phase === 'focus')){
    const base = keyToDate(T.day).getTime(), s = (T.phaseStart - base) / 60000, e = Math.min(DAY_END, (Date.now() - base) / 60000);
    const it = D.items.find(x => x.id === T.itemId);
    a += `<div class="log live" style="top:${s * PPM}px;height:${Math.max(3, (e - s) * PPM)}px;--c:var(--${it ? colorOf(it) : 'sora'})"></div>`;
  }
  act.innerHTML = a;
}
function blockHTML(D, it, r, T){
  const top = r.s * PPM, ht = Math.max(0, (r.e - r.s) * PPM);
  if (it.kind === 'cushion'){
    const cls = ht < 3 ? 'spent' : ht < 14 ? 'thin' : '';
    return `<div class="blk k-cushion ${cls} ${sel === it.id ? 'sel' : ''}" data-drag="blk" data-id="${it.id}" style="top:${top}px;height:${Math.max(ht, 3)}px">
      <div class="bg"></div><svg class="nap"><use href="#i-nap"/></svg><div class="grip" data-grip></div></div>`;
  }
  const isCur = L.cur === it, planEnd = r.s + it.dur;
  const over = isCur && r.e > planEnd ? (r.e - planEnd) * PPM : 0;
  const got = loggedFor(D, it.id);
  const running = T && T.itemId === it.id && T.day === viewKey;
  const cls = ['blk', 'k-' + it.kind, it.done && 'done', isCur && 'cur', running && 'running', it.pinned && 'pinned',
    sel === it.id && 'sel', ht < 34 && 'compact', L.clashes.has(it.id) && 'clash', it.squeezed && 'squeezed'].filter(Boolean).join(' ');
  return `<div class="${cls}" data-drag="blk" data-id="${it.id}" style="top:${top}px;height:${ht}px;--c:var(--${colorOf(it)})">
    <div class="bg"></div>
    ${over ? `<div class="over" style="height:${over}px"></div>` : ''}
    <div class="txt"><span class="ti">${esc(it.title)}</span><span class="tm">${fmt(r.s)}–${fmt(r.e)}</span>${it.tally ? `<span class="tally">${tallyStr(it.tally)}</span>` : ''}</div>
    ${got ? `<div class="got"><i style="width:${Math.min(100, got / it.dur * 100)}%"></i></div>` : ''}
    ${it.done ? `<svg class="stamp"><use href="#i-stamp"/></svg>` : ''}
    <svg class="pinmark"><use href="#i-pin"/></svg>
    <div class="acts">
      <button data-act="timer" aria-label="开始计时"><svg class="i"><use href="#i-play"/></svg></button>
      <button data-act="log" aria-label="补记时间"><svg class="i"><use href="#i-pen"/></svg></button>
      <button data-act="done" class="${it.done ? 'on' : ''}" aria-label="完成"><svg class="i" style="width:20px;height:20px"><use href="#i-stamp"/></svg></button>
      <button data-act="pin" class="${it.pinned ? 'on' : ''}" aria-label="钉住时间"><svg class="i"><use href="#i-pin"/></svg></button>
    </div>
    ${it.pinned || it.done ? '' : '<div class="grip" data-grip></div>'}
  </div>`;
}
// group overlapping records and give each a column inside its group
function logColumns(logs){
  const out = new Map(), sorted = [...logs].sort((a, b) => a.start - b.start || a.end - b.end);
  let group = [], groupEnd = -1;
  const flush = () => {
    const ends = [];
    for (const l of group){
      let c = ends.findIndex(e => e <= l.start);
      if (c < 0){ c = ends.length; ends.push(0); }
      ends[c] = l.end; out.set(l.id, { c });
    }
    for (const l of group) out.get(l.id).n = ends.length;
    group = [];
  };
  for (const l of sorted){
    if (group.length && l.start >= groupEnd){ flush(); groupEnd = -1; }
    group.push(l); groupEnd = Math.max(groupEnd, l.end);
  }
  if (group.length) flush();
  return out;
}
function logHTML(l, col = { c: 0, n: 1 }){
  const ht = (l.end - l.start) * PPM;
  const w = 100 / col.n, pos = col.n > 1 ? `left:calc(${col.c * w}% + 8px);right:auto;width:calc(${w}% - 12px);` : '';
  return `<div class="log ${ht < 18 ? 'tiny' : ''} ${selLog === l.id ? 'sel' : ''}" data-log="${l.id}" style="${pos}top:${l.start * PPM}px;height:${Math.max(3, ht)}px;--c:var(--${l.color})">
    <span class="lt">${esc(l.title)}<b>${fmt(l.start)}–${fmt(l.end)}</b></span>
    <span class="h top" data-h="top"></span><span class="h bot" data-h="bot"></span>
    <button class="x" data-act="dellog" aria-label="删除这条记录"><svg class="i"><use href="#i-x"/></svg></button>
  </div>`;
}
function renderSide(D){
  const total = D.logs.reduce((a, l) => a + (l.end - l.start), 0);
  $('#sum').innerHTML = `<svg class="i"><use href="#i-clock"/></svg>${dur(total)}`;
  $('#tallyBig').textContent = tallyStr(D.items.reduce((a, it) => a + (it.tally || 0), 0));
  $('#stamps').innerHTML = D.items.filter(it => it.done).map(() => '<svg><use href="#i-stamp"/></svg>').join('');
}
const prog = $('#prog'), CIRC = 2 * Math.PI * 124;
prog.style.strokeDasharray = CIRC;
function renderTimer(){
  const S = getState(), T = S.timer, now = Date.now();
  let txt, frac = 0, brk = false;
  const mode = T ? T.mode : S.settings.timerMode;
  if (!T) txt = mode === 'pomodoro' ? pad(S.settings.focusMin) + ':00' : '00:00';
  else if (T.mode === 'stopwatch'){
    const s = Math.floor((now - T.phaseStart) / 1000);
    txt = s >= 3600 ? Math.floor(s / 3600) + ':' + pad(Math.floor(s / 60) % 60) + ':' + pad(s % 60) : pad(Math.floor(s / 60)) + ':' + pad(s % 60);
    frac = (s % 3600) / 3600;
  } else {
    const len = (T.phase === 'focus' ? S.settings.focusMin : S.settings.breakMin) * 60;
    const left = Math.max(0, Math.ceil(len - (now - T.phaseStart) / 1000));
    txt = pad(Math.floor(left / 60)) + ':' + pad(left % 60); frac = left / len; brk = T.phase === 'break';
  }
  const tEl = $('#timer'); tEl.textContent = txt; tEl.className = 'timer' + (brk ? ' break' : '');
  prog.style.stroke = brk ? 'var(--matcha)' : 'var(--yamabuki)';
  // stopwatch: the ring fills over each hour; pomodoro: it empties as the phase runs out
  prog.style.strokeDashoffset = T ? CIRC * (1 - frac) : CIRC;
  $('#go').disabled = !!T; $('#stop').disabled = !T;
  document.querySelectorAll('#modes button').forEach(b => { b.setAttribute('aria-checked', b.dataset.mode === mode); b.disabled = !!T; });
  const it = T && getDay(T.day).items.find(x => x.id === T.itemId);
  const tg = $('#target'), want = it ? `<span class="chip" style="--c:var(--${colorOf(it)})"></span>${esc(it.title)}` : '';
  if (tg.innerHTML !== want) tg.innerHTML = want;
}
function miuMode(){
  const T = getState().timer;
  if (T) return T.mode === 'pomodoro' && T.phase === 'break' ? 'break' : 'focus';
  const Lt = layout(getDay(todayKey()), nowMin());
  return Lt.overflow.length || Lt.clashes.size ? 'worried' : 'idle';
}
function scrollToNow(){
  const m = viewKey === todayKey() ? nowMin() - 150 : 7 * 60;
  center.scrollTop = Math.max(0, m * PPM);
}

/* ---------- block actions ---------- */
function editDay(fn){ update(S => fn(day(viewKey), S)); }
function toggleDone(id){
  let cheered = false;
  editDay((D, S) => {
    const it = D.items.find(x => x.id === id); if (!it) return;
    if (it.done){ it.done = false; return; }
    const r = L.res.get(it.id), got = loggedFor(D, it.id);
    it.actual = got > 0 ? Math.max(5, r5(got)) : L.cur === it ? Math.max(5, r5(nowMin() - r.s)) : it.dur;
    it.done = true; cheered = true;
    if (S.timer && S.timer.itemId === it.id && S.timer.day === viewKey) closeTimer(S, Date.now());
  });
  if (cheered && miu) setTimeout(() => miu.cheer(), 0);
}
function togglePin(id){
  editDay(D => {
    const it = D.items.find(x => x.id === id); if (!it) return;
    const r = L.res.get(it.id);
    if (it.pinned){ it.pinned = false; D.items.splice(D.items.indexOf(it), 1); D.items.splice(insertIndex(D, L, it.start, it), 0, it); }
    else { it.pinned = true; it.start = r5(r.s); }
  });
}
function placeAt(D, it, T){
  const idx = insertIndex(D, L, T, it);
  D.items.splice(idx, 0, it);
  const firstFlow = D.items.find(x => !x.pinned);
  if (firstFlow === it) D.flowStart = clamp(r5(T), 0, DAY_END - 5);   // dropped before everything: the day starts here
}

/* ---------- popovers ---------- */
function openPop(x, y, html, onReady){
  pop.innerHTML = html; pop.hidden = false;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = clamp(x, 8, innerWidth - w - 8) + 'px';
  pop.style.top = clamp(y, 8, innerHeight - h - 8) + 'px';
  if (onReady) onReady(pop);
}
function closePop(){ pop.hidden = true; pop.innerHTML = ''; }
function pickItem(x, y, onPick){
  const D = getDay(viewKey), items = D.items.filter(it => it.kind !== 'cushion');
  openPop(x, y, items.length
    ? `<div class="pick">${items.map(it => `<button data-pick="${it.id}"><span class="chip" style="--c:var(--${colorOf(it)})"></span>${esc(it.title)}</button>`).join('')}</div>`
    : `<div class="empty">先放一个块到计划里</div>`, p => {
      p.onclick = e => { const b = e.target.closest('[data-pick]'); if (b){ closePop(); onPick(b.dataset.pick); } };
    });
}
function logForm(it, x, y){
  const r = L.res.get(it.id), now = nowFor(viewKey);
  let s = r5(r.s), e = r5(r.s + it.dur);
  if (Number.isFinite(now) && now > s && now < e) e = r5(now);
  const toMin = v => { const [hh, mm] = v.split(':').map(Number); return hh * 60 + mm; };
  openPop(x, y, `<form><input type="time" name="s" value="${fmt(s)}" step="300" required>–<input type="time" name="e" value="${fmt(e)}" step="300" required>
    <button class="ok" aria-label="记录"><svg class="i"><use href="#i-pen"/></svg></button></form>`, p => {
    const f = p.querySelector('form'); f.s.focus();
    f.onsubmit = ev => {
      ev.preventDefault();
      const a = toMin(f.s.value), b = toMin(f.e.value);
      if (!(b > a)){ f.e.focus(); return; }
      closePop();
      editDay(D => D.logs.push({ id: uid(), itemId: it.id, title: it.title, color: colorOf(it), start: a, end: Math.min(b, DAY_END) }));
    };
  });
}

/* ---------- clicks ---------- */
let swallowClick = false;   // the click that ends a drag shouldn't also close what the drag opened
document.addEventListener('click', e => {
  if (swallowClick){ swallowClick = false; return; }
  if (!pop.hidden && !e.target.closest('#pop')) closePop();
  const b = e.target.closest('[data-act]');
  if (b){
    const blk = b.closest('[data-id]'), id = blk && blk.dataset.id, a = b.dataset.act;
    if (a === 'timer') return startTimer(id);
    if (a === 'log'){ const it = getDay(viewKey).items.find(x => x.id === id); const rc = b.getBoundingClientRect(); return logForm(it, rc.right + 8, rc.top - 10); }
    if (a === 'done') return toggleDone(id);
    if (a === 'pin') return togglePin(id);
    if (a === 'squeeze') return editDay(D => squeeze(D, nowFor(viewKey)));
    if (a === 'tomorrow') return update(S => {
      const D = day(viewKey), N = day(shiftKey(viewKey, 1)), moving = L.overflow.slice();
      for (const it of moving){ D.items.splice(D.items.indexOf(it), 1); Object.assign(it, { done: false, squeezed: false }); N.items.push(it); }
    });
    if (a === 'dellog'){ const id2 = b.closest('[data-log]').dataset.log; selLog = null; return editDay(D => { D.logs = D.logs.filter(l => l.id !== id2); }); }
    return;
  }
  if (!e.target.closest('.theme')) $('#theme').classList.remove('open');
});
$('#themeBtn').onclick = () => $('#theme').classList.toggle('open');
$('#prevDay').onclick = () => { viewKey = shiftKey(viewKey, -1); sel = selLog = null; render(); scrollToNow(); };
$('#nextDay').onclick = () => { viewKey = shiftKey(viewKey, 1); sel = selLog = null; render(); scrollToNow(); };
$('#todayBtn').onclick = () => { viewKey = todayKey(); sel = selLog = null; render(); scrollToNow(); };
$('#modes').onclick = e => { const b = e.target.closest('[data-mode]'); if (b && !getState().timer) update(S => { S.settings.timerMode = b.dataset.mode; }); };
$('#go').onclick = () => {
  const D = getDay(todayKey()), Lt = layout(D, nowMin());
  const pick = (viewKey === todayKey() && sel && D.items.find(x => x.id === sel && x.kind !== 'cushion')) || Lt.cur;
  if (pick) return startTimer(pick.id);
  const g = $('#go'); g.classList.remove('nudge'); void g.offsetWidth; g.classList.add('nudge');   // nothing to time yet
};
$('#stop').onclick = stopTimer;

// new sticky note / new tape
function inlineInput(host, onDone){
  if (host.querySelector('input')) return;
  host.insertAdjacentHTML('beforeend', '<input maxlength="24" aria-label="名字">');
  const inp = host.querySelector('input'); inp.focus();
  let done = false;
  const commit = ok => { if (done) return; done = true; const v = inp.value.trim(); if (ok && v) onDone(v); else render(); };
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') commit(true); if (ev.key === 'Escape') commit(false); });
  inp.addEventListener('blur', () => commit(true));
}
$('#pile').addEventListener('click', e => {
  const add = e.target.closest('#addNote'); if (!add) return;
  add.innerHTML = '';
  inlineInput(add, v => update(S => { S.inbox.unshift({ id: uid(), title: v, dur: 30 }); }));
});
$('#rack').addEventListener('click', e => {
  const add = e.target.closest('#addTpl'); if (!add) return;
  inlineInput(add, v => update(S => {
    const used = S.templates.filter(t => !t.cushion).length;
    S.templates.splice(S.templates.findIndex(t => t.cushion), 0, { id: uid(), title: v, dur: 30, color: COLORS[used % COLORS.length] });
  }));
});
['#pile', '#rack'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'addNote' || e.target.id === 'addTpl')) e.target.click(); }));

// rename a block: double-click its name
plan.addEventListener('dblclick', e => {
  const ti = e.target.closest('.ti'); if (!ti) return;
  const id = ti.closest('[data-id]').dataset.id;

  document.getSelection().selectAllChildren(ti);
  const finish = () => {

  };
  ti.addEventListener('blur', finish);
  ti.addEventListener('keydown', ev => { if (ev.key === 'Enter'){ ev.preventDefault(); ti.blur(); } if (ev.key === 'Escape'){ ti.textContent = ''; ti.blur(); } });

document.addEventListener('keydown', e => {
  if (e.target.closest('input,[contenteditable=true]')) return;
  if (e.key === 'Escape'){ closePop(); sel = selLog = null; render(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selLog){
    const id = selLog; selLog = null; editDay(D => { D.logs = D.logs.filter(l => l.id !== id); });
  }
});

/* ---------- drag & drop, resize, logging on the actual lane ---------- */
let drag = null, rez = null, logDrag = null, draft = null;
const ins = $('#ins');
const timeAtY = y => (y - tl.getBoundingClientRect().top) / PPM;

document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('#pop')) return;
  const grip = e.target.closest('[data-grip]');
  if (grip){
    const it = getDay(viewKey).items.find(x => x.id === grip.closest('[data-id]').dataset.id);
    rez = { id: it.id, y0: e.clientY, d0: it.dur }; e.preventDefault(); return;
  }
  const lg = e.target.closest('[data-log]');
  if (lg && !e.target.closest('[data-act]') && !lg.classList.contains('live')){
    const l = getDay(viewKey).logs.find(x => x.id === lg.dataset.log);
    logDrag = { id: l.id, mode: e.target.dataset.h || 'move', y0: e.clientY, s0: l.start, e0: l.end, moved: false };
    e.preventDefault(); return;
  }
  if (e.target === act){                       // draw a new record on the actual lane
    const s = clamp(r5(timeAtY(e.clientY)), 0, DAY_END - 5);
    draft = { s, e: s, el: document.createElement('div') };
    draft.el.className = 'draft'; act.appendChild(draft.el); e.preventDefault(); return;
  }
  const src = e.target.closest('[data-drag]');
  if (!src || e.target.closest('[data-act],input,[contenteditable=true]')) return;
  const rc = src.getBoundingClientRect();
  drag = { src, type: src.dataset.drag, id: src.dataset.id, x0: e.clientX, y0: e.clientY, ox: e.clientX - rc.left, oy: e.clientY - rc.top, w: rc.width, h: rc.height, started: false };
});

document.addEventListener('pointermove', e => {
  if (rez){
    const nd = Math.max(5, r5(rez.d0 + (e.clientY - rez.y0) / PPM));
    const it = getDay(viewKey).items.find(x => x.id === rez.id);
    if (it && nd !== it.dur) editDay(D => { D.items.find(x => x.id === rez.id).dur = nd; });
    return;
  }
  if (logDrag){
    const dm = r5((e.clientY - logDrag.y0) / PPM);
    if (dm) logDrag.moved = true;
    editDay(D => {
      const l = D.logs.find(x => x.id === logDrag.id); if (!l) return;
      if (logDrag.mode === 'move'){ const len = logDrag.e0 - logDrag.s0; l.start = clamp(logDrag.s0 + dm, 0, DAY_END - len); l.end = l.start + len; }
      if (logDrag.mode === 'top') l.start = clamp(logDrag.s0 + dm, 0, l.end - 5);
      if (logDrag.mode === 'bot') l.end = clamp(logDrag.e0 + dm, l.start + 5, DAY_END);
    });
    return;
  }
  if (draft){
    draft.e = clamp(r5(timeAtY(e.clientY)), 0, DAY_END);
    const a = Math.min(draft.s, draft.e), b = Math.max(draft.s, draft.e);
    Object.assign(draft.el.style, { top: a * PPM + 'px', height: Math.max(2, (b - a) * PPM) + 'px' });
    draft.el.innerHTML = `<span>${fmt(a)}–${fmt(b)}</span>`;
    return;
  }
  if (!drag) return;
  if (!drag.started){
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
    drag.started = true;
    const g = drag.src.cloneNode(true);
    g.classList.add('ghost'); g.classList.remove('sel');
    Object.assign(g.style, { width: drag.w + 'px', height: drag.h + 'px', top: 0, left: 0, position: 'fixed' });
    document.body.appendChild(g); drag.ghost = g;
    if (drag.type !== 'tpl') drag.src.classList.add('lifted');
    document.body.classList.add('dragging'); sel = null;
  }
  drag.ghost.style.transform = `translate(${e.clientX - drag.ox}px,${e.clientY - drag.oy}px) rotate(2.5deg)`;
  const z = zoneAt(e.clientX, e.clientY);
  document.querySelectorAll('.zone.hot').forEach(n => n.classList.remove('hot'));
  if (z.el) z.el.classList.add('hot');
  if (z.name === 'tl'){
    const D = getDay(viewKey), T = timeAtY(e.clientY - drag.oy);
    const it = drag.type === 'blk' && D.items.find(x => x.id === drag.id);
    let at;
    if (it && it.pinned) at = r5(T);
    else {
      // where the block will really land: before the next flowing block, or at the drop time if it becomes the first
      const i = insertIndex(D, L, T, it || null), nx = D.items[i];
      const first = D.items.slice(0, i).every(x => x.pinned || x === it);
      at = first ? r5(T) : nx ? L.res.get(nx.id).s : lastEnd(D, it, T);
    }
    at = clamp(at, 0, DAY_END);
    ins.style.display = 'block'; ins.style.top = at * PPM + 'px'; ins.querySelector('span').textContent = fmt(at);
  } else ins.style.display = 'none';
  const cr = center.getBoundingClientRect();
  if (e.clientX > cr.left && e.clientX < cr.right){
    if (e.clientY < cr.top + 60) center.scrollTop -= 14; else if (e.clientY > cr.bottom - 50) center.scrollTop += 14;
  }
});
function lastEnd(D, excl, T){
  const flow = D.items.filter(x => x !== excl && !x.pinned);
  if (!flow.length) return r5(T);
  return Math.max(...flow.map(x => L.res.get(x.id).e));
}
function zoneAt(x, y){
  const el = document.elementFromPoint(x, y), z = el && el.closest('[data-zone]');
  return z ? { el: z, name: z.dataset.zone } : {};
}

document.addEventListener('pointerup', e => {
  if (rez){ rez = null; render(); return; }
  if (logDrag){
    const d = logDrag; logDrag = null;
    if (!d.moved){ selLog = selLog === d.id ? null : d.id; sel = null; }
    render(); return;
  }
  if (draft){
    const d = draft; draft = null;
    const a = Math.min(d.s, d.e), b = Math.max(d.s, d.e);
    if (b - a < 5){ d.el.remove(); return; }
    swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
    pickItem(e.clientX + 10, e.clientY - 20, id => {
      const it = getDay(viewKey).items.find(x => x.id === id);
      editDay(D => D.logs.push({ id: uid(), itemId: id, title: it.title, color: colorOf(it), start: a, end: b }));
    });
    // keep the outline visible until the popover closes
    const obs = new MutationObserver(() => { if (pop.hidden){ d.el.remove(); obs.disconnect(); } });
    obs.observe(pop, { attributes: true });
    return;
  }
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.started){
    if (d.type === 'blk'){ sel = sel === d.id ? null : d.id; selLog = null; render(); }
    return;
  }
  const z = zoneAt(e.clientX, e.clientY);
  const T = timeAtY(e.clientY - d.oy);
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 0);
  d.ghost.remove(); ins.style.display = 'none';
  document.body.classList.remove('dragging');
  document.querySelectorAll('.zone.hot').forEach(n => n.classList.remove('hot'));
  drop(d, z.name, T);
  render();
});

function drop(d, zone, T){
  if (!zone) return;
  const toTL = zone === 'tl' || zone === 'tray';
  const at = zone === 'tray' ? DAY_END + 999 : clamp(T, 0, DAY_END - 5);
  update(S => {
    const D = day(viewKey);
    if (d.type === 'tpl'){
      const tp = S.templates.find(x => x.id === d.id); if (!tp) return;
      if (toTL) placeAt(D, tp.cushion ? { id: uid(), title: '', dur: tp.dur, kind: 'cushion' } : { id: uid(), title: tp.title, dur: tp.dur, color: tp.color, kind: 'routine', tally: 0 }, at);
      else if (zone === 'pile' && !tp.cushion) S.inbox.unshift({ id: uid(), title: tp.title, dur: tp.dur });
      else if (zone === 'trash' && !tp.cushion) S.templates.splice(S.templates.indexOf(tp), 1);
    }
    if (d.type === 'note'){
      const n = S.inbox.find(x => x.id === d.id); if (!n) return;
      if (toTL){ S.inbox.splice(S.inbox.indexOf(n), 1); placeAt(D, { id: n.id, title: n.title, dur: n.dur, kind: 'popup', tally: 0 }, at); }
      else if (zone === 'rack'){ S.inbox.splice(S.inbox.indexOf(n), 1); S.templates.splice(S.templates.findIndex(t => t.cushion), 0, { id: uid(), title: n.title, dur: n.dur, color: 'matcha' }); }
      else if (zone === 'trash') S.inbox.splice(S.inbox.indexOf(n), 1);
    }
    if (d.type === 'blk'){
      const it = D.items.find(x => x.id === d.id); if (!it) return;
      if (toTL){
        if (it.pinned) it.start = clamp(r5(T), 0, DAY_END - it.dur);
        else { D.items.splice(D.items.indexOf(it), 1); placeAt(D, it, at); }
        return;
      }
      if (S.timer && S.timer.itemId === it.id && S.timer.day === viewKey) closeTimer(S, Date.now());
      D.items.splice(D.items.indexOf(it), 1);
      if (zone === 'pile' && it.kind !== 'cushion') S.inbox.unshift({ id: it.id, title: it.title, dur: it.dur });
      if (zone === 'rack' && it.kind !== 'cushion' && !S.templates.some(x => x.title === it.title))
        S.templates.splice(S.templates.findIndex(t => t.cushion), 0, { id: uid(), title: it.title, dur: it.dur, color: it.kind === 'popup' ? 'matcha' : it.color });
    }
  });
}

/* ---------- boot ---------- */
subscribe(() => { if (!drag) render(); });
render();
scrollToNow();
setInterval(tick, 500);   // real-time deltas, so the timer stays right in background tabs too

return {};
})();
</script>
