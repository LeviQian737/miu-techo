const INK = '#2B2B33', DARK = '#1E1E22', WHITE = '#FFFFFF', PALE = '#D3D5D9', PINK = '#E88A9A',
      RED = '#E0533F', WOOD = '#C99E6A', WOOD2 = '#A87E4E', KEY = '#E4E6E8', KEY2 = '#B9BDC2',
      CUSH = '#F4BCC8', SWEAT = '#BFE0F2', HEART = '#F28CA6';
const MX = x => 27 - x; // the cat is symmetric around x = 13.5

/* ---------- pixel helpers ---------- */
function paths(cells){
  const by = {};
  for (const [x, y, c] of cells) (by[c] = by[c] || []).push([x, y]);
  let s = '';
  for (const c in by){
    const pts = by[c].sort((a, b) => a[1] - b[1] || a[0] - b[0]);
    let d = '', i = 0;
    while (i < pts.length){
      const [x, y] = pts[i]; let n = 1;
      while (i + n < pts.length && pts[i+n][1] === y && pts[i+n][0] === x + n) n++;
      d += `M${x} ${y}h${n}v1h-${n}z`; i += n;
    }
    s += `<path fill="${c}" d="${d}"/>`;
  }
  return s;
}
const g = (cls, cells) => `<g class="${cls}">${paths(cells)}</g>`;
const rect = (x, y, w, h, c) => { const o = []; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) o.push([x + i, y + j, c]); return o; };
const K = (pts, c = DARK) => pts.map(([x, y]) => [x, y, c]);
const sym = cells => cells.concat(cells.map(([x, y, c]) => [MX(x), y, c]));
const shift = (cells, dx, dy) => cells.map(([x, y, c]) => [x + dx, y + dy, c]);
const rows = (strs, x0, y0, pal) => { const o = []; strs.forEach((r, j) => [...r].forEach((ch, i) => { if (pal[ch]) o.push([x0 + i, y0 + j, pal[ch]]); })); return o; };

/* ---------- parts ---------- */
const Z = D.zones;  // absolute pixels per comnyang zone: tail, body, legFl, legFr, earL, earR, head
const WHISKERS = [...rect(0,14,5,1,DARK), ...rect(23,14,5,1,DARK), ...rect(0,17,6,1,DARK), ...rect(23,17,6,1,DARK)];
const PUP_L = rect(8,11,3,3,DARK), PUP_R = rect(17,11,3,3,DARK);
const HAPPY_L = K([[7,13],[8,12],[9,11],[10,12],[11,13]]);
const FACES = {
  open:   {still:[], look:[...PUP_L, ...PUP_R]},
  focus:  {still:sym(K([[7,11],[8,11],[9,11],[10,11],[11,11]])), look:[...rect(8,12,3,2,DARK), ...rect(17,12,3,2,DARK)]}, // lids down: locked in
  worry:  {still:sym(K([[7,9],[8,9],[9,8],[10,8]])), look:[...PUP_L, ...PUP_R]},                                         // brows up
  wink:   {still:HAPPY_L, look:PUP_R},                                                                                     // tap: a cheeky wink
  blink:  K([[8,12],[9,12],[10,12],[17,12],[18,12],[19,12]]),
  happy:  sym(HAPPY_L),
  sleep:  sym(K([[7,11],[8,12],[9,13],[10,12],[11,11]])),
  squint: sym(K([[8,11],[9,12],[8,13]])),
};
// yawn: the little ω becomes an open "o"
const MOUTH_OPEN = [...[[11,15],[15,15],[11,16],[15,16],[13,14]].map(([x, y]) => [x, y, WHITE]),
  ...K([[12,15],[13,15],[14,15],[12,16],[14,16],[12,17],[13,17],[14,17]]), [13,16,PINK]];
const SWEAT_DROP = K([[25,4],[24,5],[25,5],[24,6],[25,6]], SWEAT);
const BAND = [...D.band.map(([x, y]) => [x, y, WHITE]), ...rect(13,6,2,2,RED),
  ...K([[25,6],[26,5],[27,4],[25,7],[26,8],[27,9]], WHITE)];
const DESK = [...rect(6,22,16,2,KEY), ...K([[7,23],[9,23],[11,23],[13,23],[15,23],[17,23],[19,23]], KEY2),
  ...rect(1,24,26,1,WOOD), ...rect(1,25,26,1,WOOD2), ...rect(3,26,2,10,WOOD2), ...rect(23,26,2,10,WOOD2)];
const PAWS_A = [...rect(8,20,3,2,PALE), ...rect(17,21,3,2,PALE)];   // left paw up
const PAWS_B = [...rect(8,21,3,2,PALE), ...rect(17,20,3,2,PALE)];   // right paw up
const FLOP_DX = -3, FLOP_DY = 9;
const CUSHION = [...rect(-1,34,38,1,CUSH), ...rect(-2,35,40,1,CUSH)];
const FLOP_PAWS = [...rect(5,32,4,2,PALE), ...rect(12,32,4,2,PALE)];
const HEART_AT = (x, y) => rows(['.H.H.','HHHHH','.HHH.','..H..'], x, y, {H:HEART});
const ZED_AT = (x, y) => rows(['WWWW','..W.','.W..','WWWW'], x, y, {W:WHITE});

/* ---------- markup ---------- */
let uid = 0;
function faces(dx = 0, dy = 0){
  return Object.entries(FACES).map(([k, v]) => Array.isArray(v)
    ? g('face f-' + k, shift(v, dx, dy))
    : `<g class="face f-${k}">${paths(shift(v.still, dx, dy))}<g class="look">${paths(shift(v.look, dx, dy))}</g></g>`).join('');
}
function headGroup(dx = 0, dy = 0, extra = ''){
  const s = c => shift(c, dx, dy);
  return `<g class="head">${g('whiskers', s(WHISKERS))}${g('ear-l', s(Z.earL))}${g('ear-r', s(Z.earR))}${paths(s(Z.head))}${faces(dx, dy)}${extra}</g>`;
}
function svgMarkup(){
  const id = 'miuo' + (uid++);
  const sit = `<g class="pose p-sit">
      ${g('tail sway', Z.tail)}${g('body', Z.body)}${g('legs', [...Z.legFl, ...Z.legFr])}
      ${headGroup(0, 0, g('fx-mouth', MOUTH_OPEN) + g('fx-sweat', SWEAT_DROP))}
    </g>`;
  const work = `<g class="pose p-work">
      ${g('tail sway', Z.tail)}${g('body', Z.body.filter(([, y]) => y <= 23))}
      ${headGroup(0, 0, g('band', BAND))}
      ${g('desk', DESK)}${g('paws pA', PAWS_A)}${g('paws pB', PAWS_B)}
    </g>`;
  const flop = `<g class="pose p-flop">
      ${g('cushion', CUSHION)}${g('body breathe', D.flopBody)}${g('tail', D.flopTail)}
      ${headGroup(FLOP_DX, FLOP_DY)}${g('paws', FLOP_PAWS)}
    </g>`;
  return `<svg class="mp" viewBox="-6 -7 46 46" shape-rendering="crispEdges" role="img" aria-label="Miu">
    <defs><filter id="${id}" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology operator="dilate" radius="1" in="SourceAlpha" result="a1"/>
      <feMorphology operator="dilate" radius="2" in="SourceAlpha" result="a2"/>
      <feFlood flood-color="${INK}"/><feComposite in2="a2" operator="in" result="ink"/>
      <feFlood flood-color="${WHITE}"/><feComposite in2="a1" operator="in" result="edge"/>
      <feMerge><feMergeNode in="ink"/><feMergeNode in="edge"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <g class="hop"><g filter="url(#${id})">
      ${sit}${work}${flop}
      <g class="fx-hearts">${g('ht h1', HEART_AT(19,-5))}${g('ht h2', HEART_AT(3,-3))}${g('ht h3', HEART_AT(24,0))}</g>
      <g class="fx-zzz">${g('z z1', ZED_AT(20,8))}${g('z z2', ZED_AT(24,3))}${g('z z3', ZED_AT(28,-2))}</g>
    </g></g>
  </svg>`;
}

const CSS = `

.mp .pose,.mp .face,.mp [class^="fx-"]{display:none}

.mp.purr .head{animation:mpPurr .16s steps(2) infinite}
@keyframes mpPurr{50%{transform:translate(0,.3px)}}

.mp .pA{animation:mpPawA .36s steps(1) infinite}

@keyframes mpPawA{0%{opacity:1}50%{opacity:0}}

.mp .breathe{animation:mpBreathe 2.8s steps(1) infinite}

/* ---------- controller ---------- */
function mount(host){
  if (!document.getElementById('miu-pixel-css')){
    const st = document.createElement('style'); st.id = 'miu-pixel-css'; st.textContent = CSS; document.head.appendChild(st);
  }
  host.innerHTML = svgMarkup();
  const svg = host.querySelector('svg'), hop = svg.querySelector('.hop');
  let mode = 'idle', override = null, overrideTimer = 0, idleTimer = 0, yawnTimer = 0, dozing = false;
  let petting = false, petDist = 0, lastPt = null, purrStop = 0, down = null;

  const looks = () => svg.querySelectorAll('.look');
  function apply(){
    const v = override || base();
    svg.dataset.pose = v.pose; svg.dataset.face = v.face;
    for (const fx of ['mouth','sweat','hearts','zzz','purr']) svg.classList.toggle(fx, !!v[fx]);
  }
  function base(){
    if (mode === 'focus') return {pose:'work', face:'focus', hearts:petting, purr:false};
    if (mode === 'break') return {pose:'flop', face:'sleep', zzz:true, hearts:petting, purr:petting};
    if (mode === 'worried') return {pose:'sit', face: petting ? 'happy' : 'worry', sweat:!petting, hearts:petting, purr:petting};
    if (petting) return {pose: dozing ? 'flop' : 'sit', face:'happy', hearts:true, purr:true};
    if (dozing) return {pose:'sit', face:'sleep', zzz:true};
    return {pose:'sit', face:'open'};
  }
  function flash(v, ms){
    override = v; apply(); clearTimeout(overrideTimer);
    overrideTimer = setTimeout(() => { override = null; apply(); }, ms);
  }
  function doHop(){ hop.classList.remove('go'); void hop.getBoundingClientRect(); hop.classList.add('go'); }
  function wake(){
    dozing = false; clearTimeout(idleTimer); clearTimeout(yawnTimer);
    if (mode === 'idle'){
      idleTimer = setTimeout(() => { dozing = true; apply(); }, 90000);
      yawnTimer = setTimeout(function y(){ if (mode === 'idle' && !override && !petting && !dozing) flash({pose:'sit', face:'squint', mouth:true}, 1400);
        yawnTimer = setTimeout(y, 30000 + Math.random()*30000); }, 25000 + Math.random()*20000);
    }
  }

  // pet: press and stroke across Miu. tap: a little hop and a wink.
  svg.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, moved:0}; lastPt = down; petDist = 0; svg.setPointerCapture(e.pointerId); });
  svg.addEventListener('pointermove', e => {
    if (!down) return;
    const d = Math.hypot(e.clientX - lastPt.x, e.clientY - lastPt.y); lastPt = {x:e.clientX, y:e.clientY};
    down.moved += d; petDist += d;
    if (petDist > 24 && !petting){ petting = true; wake(); apply(); }
    clearTimeout(purrStop);
  });
  const release = () => {
    if (!down) return;
    const tapped = down.moved < 6; down = null;
    if (petting){ purrStop = setTimeout(() => { petting = false; apply(); }, 700); return; }
    if (tapped){
      const wasDozing = dozing; wake(); doHop();
      if (mode === 'break' || wasDozing) flash({pose: mode === 'break' ? 'flop' : 'sit', face:'open', zzz:false}, 900);
      else if (mode === 'focus') flash({pose:'work', face:'happy', hearts:true}, 900);
      else flash({pose:'sit', face:'wink', hearts:true}, 1100);
    }
  };
  svg.addEventListener('pointerup', release);
  svg.addEventListener('pointercancel', release);

  // eyes follow the pointer, one pixel at a time; left alone, Miu side-eyes the room
  let lastPointer = 0;
  const lookAt = ox => looks().forEach(l => l.style.transform = `translate(${ox}px,0)`);
  document.addEventListener('pointermove', e => {
    lastPointer = performance.now();
    const r = svg.getBoundingClientRect();
    const dx = e.clientX - (r.left + r.width/2);
    lookAt(Math.abs(dx) < r.width*0.25 ? 0 : Math.sign(dx));
  });
  (function glance(){
    if (performance.now() - lastPointer > 4000){
      lookAt([-1, 1, -1, 0][Math.floor(Math.random()*4)]);
      setTimeout(() => { if (performance.now() - lastPointer > 4000) lookAt(0); }, 1400 + Math.random()*900);
    }
    setTimeout(glance, 5000 + Math.random()*5000);
  })();

  wake(); apply();
  return {
    setMode(m){
      if (m === mode) return;
      const prev = mode; mode = m; wake();
      clearTimeout(overrideTimer); override = null;
      if (m === 'break' && prev === 'focus') flash({pose:'sit', face:'squint', mouth:true}, 1400); // big yawn first
      else apply();
    },
    show(v){ clearTimeout(overrideTimer); override = v; apply(); }, // pin a look (for previews)
    cheer(){ wake(); doHop(); flash({pose: mode === 'focus' ? 'work' : 'sit', face:'happy', hearts:true}, 1600); },
    get mode(){ return mode; },
    el: svg,
  };
}
window.MiuPixel = {mount};
})();

</script>
<style>
:root{--paper:#F7F8F5;--grid:#DDE6E9;--ink:#2B2B33;--soft:#6B6E78;--tatami:#D8D3A6}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"LXGW WenKai Screen","PingFang SC",sans-serif}
main{max-width:1060px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:28px;margin:0 0 4px}
p{margin:0 0 24px;color:var(--soft);max-width:60ch}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;margin-bottom:36px}
.stage{aspect-ratio:1;border:1.5px solid var(--ink);border-radius:50%;overflow:hidden;position:relative;max-width:420px;
  background:linear-gradient(transparent 76%,var(--tatami) 76%),
             linear-gradient(var(--grid) 1px,transparent 1px) 0 0/20px 20px,linear-gradient(90deg,var(--grid) 1px,#FBFBF7 1px) 0 0/20px 20px}
.stage>div{position:absolute;left:12%;right:12%;top:14%;bottom:10%}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.modes button{font:inherit;font-size:15px;border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;cursor:pointer}
.modes button.on{background:var(--ink);color:var(--paper)}
.how{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:15px}
.how b{display:inline-block;min-width:5.5em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#FBFBF7}
.card .pic{aspect-ratio:1;padding:14px;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/12px 12px}
.card .cap{border-top:1.5px solid var(--ink);padding:8px 12px;font-size:14px}
@media (max-width:700px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Pixel Miu</h1>
  <p>按住 Miu 来回摸会呼噜冒爱心，点一下会蹦一下，它的眼睛会跟着你的鼠标。下面的按钮切换 App 里的状态。</p>
  <section class="hero">
    <div class="stage"><div id="big"></div></div>
    <div>
      <div class="modes" id="modes">
        <button data-m="idle" class="on">空闲</button>
        <button data-m="focus">番茄专注</button>
        <button data-m="break">休息</button>
        <button data-m="worried">计划出问题</button>
        <button data-cheer>盖章完成</button>
      </div>
      <ul class="how">
        <li><b>摸摸</b>按住来回划：闭眼、呼噜、尾巴快摆、冒爱心</li>
        <li><b>点一下</b>蹦一下，冲你眨一只眼；睡着时会睁眼看你</li>
        <li><b>空闲</b>眨眼、眼珠自己左右瞟、偶尔甩尾巴、隔一会儿打个大哈欠；90 秒没人理会打盹</li>
        <li><b>专注</b>绑头巾，两只爪子轮流敲键盘</li>
        <li><b>休息</b>先打哈欠，然后摊平在坐垫上打呼</li>
      </ul>
    </div>
  </section>
  <div class="cards" id="cards"></div>
</main>
<script>
const big = MiuPixel.mount(document.getElementById('big'));
document.getElementById('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.cheer !== undefined) return big.cheer();
  document.querySelectorAll('#modes [data-m]').forEach(x => x.classList.toggle('on', x === b));
  big.setMode(b.dataset.m);
});
const looks = [
  ['空闲', {pose:'sit', face:'open'}],
  ['被摸', {pose:'sit', face:'happy', hearts:true, purr:true}],
  ['点一下：眨眼', {pose:'sit', face:'wink', hearts:true}],
  ['打哈欠', {pose:'sit', face:'squint', mouth:true}],
  ['担心', {pose:'sit', face:'worry', sweat:true}],
  ['打盹', {pose:'sit', face:'sleep', zzz:true}],
  ['专注', {pose:'work', face:'focus'}],
  ['休息', {pose:'flop', face:'sleep', zzz:true}],
];
const cards = document.getElementById('cards');
for (const [name, v] of looks){
  const c = document.createElement('div'); c.className = 'card';
  c.innerHTML = `<div class="pic"></div><div class="cap">${name}</div>`;
  cards.appendChild(c);
  MiuPixel.mount(c.querySelector('.pic')).show(v);
}
</script>
</body>
</html>
